# Every push to main that touches the app becomes a release the installed apps update from.
# A Mac can only be built on macOS, so each platform gets its own runner; the release goes out
# only if the tests and both builds pass, so every version exists for every platform. Signing
# happens when the secrets exist (docs/release.md); without them the Mac build is ad-hoc signed
# and the Windows build unsigned. The Apple certificate is scoped to the Mac steps:
# electron-builder's Windows signer falls back to CSC_LINK, and an Authenticode signature from
# a Developer ID would be refused by Windows and by the updater.
name: dist
on:
  push:
    branches: [main]
    paths-ignore: ['server/**', 'docs/**', 'CLAUDE.md', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
# A newer push makes a build in progress pointless. A cancelled publish leaves only a draft.
concurrency:
  group: dist
  cancel-in-progress: true
env:
  # The run number is the patch, so every release is newer than the last. package.json stays
  # at 0.1.0, which is why a local build is always offered the latest release.
  MAYORLY_VERSION: 0.1.${{ github.run_number }}
jobs:
  dist:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    # Accounts: set these as repository variables (the id and url are public) and a secret.
    env:
      MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL }}
      MAIN_VITE_GOOGLE_CLIENT_ID: ${{ vars.MAIN_VITE_GOOGLE_CLIENT_ID }}
      MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
      MAC_SIGNED: ${{ secrets.CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # No buildVersion here: on Windows it becomes the exe's FileVersion, which should stay the app's.
      # Authenticode signing happens when a Windows certificate is set; an empty WIN_CSC_LINK means none.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never -c.extraMetadata.version=${{ env.MAYORLY_VERSION }}
      # Mac signing and notarization: a base64 .p12 of the Developer ID Application certificate,
      # its password, and an App Store Connect app-specific password for the Apple ID. The build
      # number (CFBundleVersion) is the run number, so every build is higher than the last.
      - name: Package (macOS, signed and notarized)
        if: runner.os == 'macOS' && env.MAC_SIGNED == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never -c.mac.hardenedRuntime=true -c.mac.notarize=true -c.buildVersion=${{ github.run_number }} -c.extraMetadata.version=${{ env.MAYORLY_VERSION }}
      # Ad-hoc builds can be downloaded but never updated (Squirrel refuses them), so the update
      # feed is left out: an installed Mac app is not sent after a download it cannot use.
      - name: Package (macOS, ad-hoc)
        if: runner.os == 'macOS' && env.MAC_SIGNED != 'true'
        run: |
          npx electron-builder --mac --publish never -c.mac.identity=- -c.buildVersion=${{ github.run_number }} -c.extraMetadata.version=${{ env.MAYORLY_VERSION }}
          rm -f dist/latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: mayorly-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
  publish:
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      # A draft until every file is up, so no app ever reads a half-uploaded release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$MAYORLY_VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mayorly $MAYORLY_VERSION" --notes "$NOTES" --draft
          gh release edit "v$MAYORLY_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
