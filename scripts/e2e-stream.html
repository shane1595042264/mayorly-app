<!doctype html>
<!--
  A pretend League of Legends stream for scripts/e2e-stream.ps1, served as https://www.twitch.tv/e2e.
  A canvas painted ten times a second plays through a <video>, as Twitch's player does: a moving,
  coloured world, a still minimap bottom right, the ability bar bottom centre, a webcam, a chat
  column. The timeline runs from t0 (epoch ms, in the URL) and says when the world goes grey.
    ?plan=full        colour; a break card; a slow fade; an ad that looks like a death; a death at 100 s; colour
    ?plan=death-only  colour; a death at 25 s; colour
    ?plan=gta         Grand Theft Auto VI: colour; a black and white beat at 20 s; FAILED on a red wash at 30 s;
                      WASTED at 50 s, white on the red wash for 4 s, then red on black; colour
  GTA's words are drawn from the reader's own shapes (WORDS below, held to src/shared/streamword.ts by
  streamword.test.ts), where GTA writes them: the middle 35% of the width, 14% of the height.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>e2e - Twitch</title>
    <style>
      body { margin: 0; background: #0e0e10; color: #ddd; font: 14px sans-serif; }
      #v { width: 1280px; height: 720px; display: block; }
      .ad { position: absolute; top: 8px; left: 8px; background: #000; padding: 4px 8px; }
    </style>
  </head>
  <body>
    <a data-a-target="stream-game-link" href="#" id="game">League of Legends</a>
    <div id="player" style="position: relative">
      <video id="v" autoplay playsinline></video>
      <button data-a-target="player-mute-unmute-button" id="mute">Mute (m)</button>
    </div>
    <script>
      const q = new URLSearchParams(location.search)
      const t0 = Number(q.get('t0')) || Date.now()
      const plan = q.get('plan') || 'full'
      if (plan === 'gta') document.getElementById('game').textContent = 'Grand Theft Auto VI'
      // GTA's words, 40 x 10 cells each: the same rows as WORD_SHAPES in src/shared/streamword.ts.
      const WORDS = {
        wasted: [
          '......................................##',
          '......................................##',
          '##.###.##.#####.#####.######.#####.#####',
          '##.###.##.#####.############.#####.#####',
          '######.##....##.##....###....##.##.##.##',
          '#########.#####.#####..##.##.#####.##.##',
          '#########.#####.#####..#####.#####.##.##',
          '.########.##.##....##..#####.##....##.##',
          '.###.###..#####.#####..#####.#####.#####',
          '.###.###..#####.#####..#####.#####.#####',
        ],
        failed: [
          '.....................................###',
          '.....................................###',
          '######.######..###.##.....######.#######',
          '######.#######.###.##....#######.#######',
          '######.....###.##..##....###.###.#######',
          '######.#######.###.##....#######.#######',
          '####...#######.###.##....#######.#######',
          '###....###.###.###.##....###.....#######',
          '###....#######.###.#####.#######.#######',
          '###....#######.###.#####.#######.#######',
        ],
      }
      const W = 1280
      const H = 720
      const canvas = document.createElement('canvas')
      canvas.width = W
      canvas.height = H
      const g = canvas.getContext('2d')
      const video = document.getElementById('v')
      // Twitch's ad label is there only while an ad plays.
      let adLabel = null
      function showAd(on) {
        if (on && !adLabel) {
          adLabel = document.createElement('span')
          adLabel.className = 'ad'
          adLabel.setAttribute('data-a-target', 'video-ad-label')
          adLabel.textContent = 'Ad'
          document.getElementById('player').appendChild(adLabel)
        } else if (!on && adLabel) {
          adLabel.remove()
          adLabel = null
        }
      }

      // What the frame shows s seconds after t0.
      function scene(s) {
        if (plan === 'gta') {
          // A black and white beat of GTA's own: the old grey detector fired on these.
          if (s >= 20 && s < 24) return { world: 0, bar: 'none' }
          if (s >= 30 && s < 35) return { world: 1, bar: 'none', wash: true, word: 'failed', ink: '#f8f8f8' }
          if (s >= 50 && s < 54) return { world: 1, bar: 'none', wash: true, word: 'wasted', ink: '#f8f8f8' }
          if (s >= 54 && s < 55.5) return { world: 0, bar: 'none', black: true, word: 'wasted', ink: '#d6403e' }
          return { world: 1, bar: 'none' }
        }
        if (plan === 'death-only') return s >= 25 && s < 35 ? { world: 0.3, bar: 'dim' } : { world: 1, bar: 'lit' }
        if (s >= 25 && s < 29) return { card: true }
        // A fade over 30 s: no step from colour into grey anywhere in it.
        if (s >= 40 && s < 70) { const k = (s - 40) / 30; return { world: 1 - 0.7 * k, bar: k > 0.7 ? 'dim' : 'lit' } }
        // An ad, painted as a death would be: only the ad label keeps it from counting.
        if (s >= 75 && s < 83) return { world: 0.3, bar: 'dim', ad: true }
        if (s >= 100 && s < 110) return { world: 0.3, bar: 'dim' }
        return { world: 1, bar: 'lit' }
      }

      function draw() {
        const now = Date.now()
        const s = (now - t0) / 1000
        const t = now / 1000
        const sc = scene(s)
        showAd(!!sc.ad)
        if (sc.card) {
          // A break card: one grey picture, nothing coloured, nothing moving.
          g.fillStyle = 'hsl(0, 0%, 42%)'
          g.fillRect(0, 0, W, H)
          g.fillStyle = 'hsl(0, 0%, 70%)'
          g.font = '64px sans-serif'
          g.fillText('Be right back', 420, 360)
          return
        }
        // The world: tiles of colour that drift, as a camera moving over the map.
        for (let y = 0; y < H; y += 32) {
          for (let x = 0; x < W; x += 32) {
            const cx = x / 32
            const cy = y / 32
            const hue = (cx * 13 + cy * 7 + t * 30) % 360
            const light = 38 + 10 * Math.sin(cx * 0.5 + t * 2) * Math.cos(cy * 0.4 - t)
            g.fillStyle = `hsl(${hue}, ${20 * sc.world}%, ${light}%)`
            g.fillRect(x, y, 32, 32)
          }
        }
        // Chat down the left.
        g.fillStyle = 'hsl(0, 0%, 25%)'
        for (let y = 150; y < 500; y += 18) g.fillRect(6, y, 90, 8)
        // The webcam, in colour whatever happens in the game.
        for (let y = 324; y < 504; y += 20) {
          for (let x = 64; x < 384; x += 20) {
            g.fillStyle = `hsl(${(x + y + t * 80) % 360}, 40%, 50%)`
            g.fillRect(x, y, 20, 20)
          }
        }
        // The minimap: still, coloured, one icon moving.
        for (let y = 526; y < H; y += 16) {
          for (let x = 1094; x < W; x += 16) {
            g.fillStyle = (x / 16 + y / 16) % 2 < 1 ? 'hsl(130, 30%, 25%)' : 'hsl(200, 30%, 32%)'
            g.fillRect(x, y, 16, 16)
          }
        }
        g.fillStyle = '#fff'
        g.fillRect(1110 + ((t * 20) % 120), 600, 8, 8)
        if (sc.wash) {
          // GTA's red wash over everything.
          g.fillStyle = 'rgba(150, 10, 14, 0.82)'
          g.fillRect(0, 0, W, H)
        }
        if (sc.black) {
          g.fillStyle = '#030202'
          g.fillRect(0, 0, W, H)
        }
        if (sc.word) {
          // The word, where GTA writes it: x 32.5% to 67.5%, y 41.5% to 55.5% of the frame.
          const rows = WORDS[sc.word]
          const x0 = 0.325 * W
          const y0 = 0.415 * H
          const cw = (0.35 * W) / 40
          const ch = (0.14 * H) / 10
          g.fillStyle = sc.ink
          for (let r = 0; r < 10; r++) for (let c = 0; c < 40; c++) if (rows[r][c] === '#') g.fillRect(x0 + c * cw, y0 + r * ch, Math.ceil(cw), Math.ceil(ch))
        }
        if (sc.bar === 'none') return
        // The ability bar: bright while alive, dimmed while dead.
        for (let i = 0; i < 8; i++) {
          g.fillStyle = sc.bar === 'dim' ? `hsl(${30 + i * 40}, 15%, 25%)` : `hsl(${30 + i * 40}, 35%, 35%)`
          g.fillRect(448 + i * 48, 630, 44, 90)
        }
      }

      draw()
      setInterval(draw, 100)
      video.srcObject = canvas.captureStream(10)
      video.play().catch(() => {})
      // Twitch's mute button, as far as the eye knows it; and each change of mute, to the server.
      const button = document.getElementById('mute')
      button.onclick = () => {
        video.muted = !video.muted
        button.textContent = video.muted ? 'Unmute (m)' : 'Mute (m)'
      }
      let muted = video.muted
      setInterval(() => {
        if (video.muted === muted) return
        muted = video.muted
        fetch('/report', { method: 'POST', body: JSON.stringify({ at: Date.now(), plan, muted }) }).catch(() => {})
      }, 200)
    </script>
  </body>
</html>
