appId: app.mayorly
productName: Mayorly
copyright: Shane Li
directories:
  output: dist
  buildResources: build
# Everything the app runs is bundled into out/ by electron-vite, so no node_modules ship.
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Mayorly
  artifactName: Mayorly-Setup-${version}.${ext}
portable:
  artifactName: Mayorly-${version}-portable.${ext}
publish: null
