appId: app.mayorly
productName: Mayorly
copyright: Shane Li
directories:
  output: dist
  buildResources: build
# Everything the app runs is bundled into out/ by electron-vite, so no node_modules ship.
files:
  - out/**
  - package.json
asar: true
# mayorly://capture?text=..., mayorly://deck and friends, for Shortcuts, Raycast and browsers.
protocols:
  - name: Mayorly
    schemes: [mayorly]
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Mayorly
  artifactName: Mayorly-Setup-${version}.${ext}
portable:
  artifactName: Mayorly-${version}-portable.${ext}
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Signing: with a Developer ID certificate in the keychain (or CSC_LINK in CI) the app is
  # signed with it; `npm run ship:mac` and the dist workflow add `-c.mac.identity=-` (ad-hoc)
  # when there is none, so a local build still runs and a downloaded one is not "damaged".
  # Hardened runtime and notarization come with the certificate: see docs/release.md.
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Menu bar app: no Dock icon, no app switcher entry. Same idea as skipTaskbar on Windows.
    LSUIElement: true
    # HTTPS only: exempt from export compliance, so App Store Connect does not ask each build.
    ITSAppUsesNonExemptEncryption: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: Mayorly-${version}-${arch}.${ext}
dmg:
  artifactName: Mayorly-${version}-${arch}.${ext}
# The Mac App Store build (`npm run dist:mas`): sandboxed, with the profile from App Store Connect.
mas:
  type: distribution
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/embedded.provisionprofile
  artifactName: Mayorly-${version}-mas.${ext}
# Where the direct-download build looks for updates. Nothing is uploaded unless a build is run
# with --publish always; the dist workflow attaches artifacts to the GitHub release of the tag.
publish:
  provider: github
  owner: shane1595042264
  repo: mayorly-app
